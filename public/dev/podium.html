<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podium preview | Horse Race</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; background: #0f3d2e; color: #fff; font-family: Fredoka, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #bfe3cf; }
  .row { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .box { position: relative; border-radius: 18px; overflow: hidden; background: #121a42; }
  .box canvas { display: block; width: 100%; }
  .wide { width: 760px; }
  .phone { width: 345px; }
  .label { font-size: 13px; color: #bfe3cf; margin: 4px 0 10px; }
  button { font: inherit; padding: 6px 14px; border-radius: 10px; border: 0; cursor: pointer; }
</style>
</head>
<body>
  <h1>Podium preview</h1>
  <p>The scene shown at the top of the results after every race. <button id="replay">Replay entrance</button></p>
  <div class="row">
    <div><canvas id="poses" width="760" height="300" style="background:#3f9a3a;border-radius:18px"></canvas><div class="label">Close-up: the winner (reared up, trophy, cheering) and a sad loser (both directions)</div></div>
    <div><div class="box wide"><canvas id="c6"></canvas></div><div class="label">6 horses, desktop width</div></div>
    <div><div class="box phone"><canvas id="c4"></canvas></div><div class="label">4 horses, phone width</div></div>
    <div><div class="box phone"><canvas id="c5"></canvas></div><div class="label">5 horses, phone width</div></div>
  </div>
  <script type="module">
    import { PodiumView } from '../js/podium.js';
    import { drawHorse } from '../js/render.js';
    const pc = document.getElementById('poses'), px = pc.getContext('2d');
    const drawPoses = t => {
      px.clearRect(0, 0, 760, 300);
      px.fillStyle = 'rgba(0,0,0,.15)'; px.fillRect(0, 270, 760, 2);
      drawHorse(px, 300, 270, 2.0, 2, 1, t * 3.2, 0, { pose: 'rear', mood: 'happy', trophy: true });
      drawHorse(px, 530, 270, 1.6, 0, 3, 0, 0, { mood: 'sad', tear: (t * 0.5) % 1 });
      drawHorse(px, 560, 270, 1.6, 5, 4, 0, 0, { mood: 'sad', flip: true, tear: (t * 0.5 + 0.5) % 1 });
    };
    const horses = n => Array.from({ length: n }, (_, i) => ({ name: 'Horse ' + (i + 1), coat: (i * 3) % 8 }));
    const scenes = [
      { view: new PodiumView(document.getElementById('c6')), horses: horses(6), order: [2, 4, 0, 5, 1, 3] },
      { view: new PodiumView(document.getElementById('c4')), horses: horses(4), order: [1, 3, 0, 2] },
      { view: new PodiumView(document.getElementById('c5')), horses: horses(5), order: [4, 0, 2, 1, 3] },
    ];
    let start = performance.now();
    document.getElementById('replay').onclick = () => { start = performance.now(); scenes.forEach(s => { s.view.burst = false; s.view.confetti = []; }); };
    const frame = () => {
      requestAnimationFrame(frame);
      const t = (performance.now() - start) / 1000;
      for (const s of scenes) s.view.draw(t, s.horses, s.order);
      drawPoses(t);
    };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
